[project]
name = "prospect"
version = "0.1.0"
description = "Job-posting ingestion, filtering, LLM extraction, scoring and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "structlog>=24.1",
  "anthropic>=0.60",
  "sentence-transformers>=3.0",
]

[project.scripts]
prospect = "prospect.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prospect"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Accented letters, en dashes and arrows in prompts and reports are intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"prospect/cli.py" = ["B008"]  # typer's Option()/Argument() defaults are the idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
